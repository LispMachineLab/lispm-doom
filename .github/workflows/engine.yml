name: engine

# lispm-doom's engine, dsda-doom with its window an Emacs buffer, built for
# the Macs LispM runs on and, from main, published where
# lispm-doom-engine.el downloads it: the release engine-VERSION, VERSION
# being what `lispm-doom-engine-source-version' makes of the sources.  A
# version is built and released once; its release is never the latest.
# lispm-doom keeps a download only when its SHA-256 is the one
# lisp/lispm-doom-engine-sums.eld pins, which `make pin' writes.
on:
  push:
    branches: [main]
    paths:
      - engine/**
      - scripts/build-engine.sh
      - vendor/**
      - lisp/lispm-doom-engine.el
      - lisp/lispm-doom-engine-sums.eld
      - .github/workflows/engine.yml
  pull_request:
    paths:
      - engine/**
      - scripts/build-engine.sh
      - vendor/**
      - lisp/lispm-doom-engine.el
      - lisp/lispm-doom-engine-sums.eld
      - .github/workflows/engine.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      # lispm-prebuilt, which downloads the engine.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-prebuilt
          path: .deps/lispm-prebuilt
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '31.1'
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(emacs -Q --batch -L lisp -L .deps/lispm-prebuilt -l lispm-doom-engine --eval '(princ (lispm-doom-engine-source-version))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "engine-$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the pins
        run: make check-pins LISPM_PREBUILT=.deps/lispm-prebuilt

  build:
    name: ${{ matrix.target }}
    needs: version
    if: github.event_name == 'pull_request' || needs.version.outputs.published == 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      ASSET: lispm-doom-engine-${{ matrix.target }}.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Homebrew's libraries
        run: brew install sdl2_mixer libsndfile libzip
      - name: Build
        run: make engine
      # It needs the system's libraries and Homebrew's formulas only, which
      # LispM's App Store installs with it.
      - name: Check what it needs
        run: |
          otool -L build/lispm-doom-engine
          ! otool -L build/lispm-doom-engine | tail -n +2 | grep -v -e '^[[:space:]]*/usr/lib/' -e '^[[:space:]]*/System/' \
            -e '/opt/sdl2_mixer/' -e '/opt/sdl2-compat/' -e '/opt/libsndfile/' -e '/opt/libzip/'
      - name: Pack
        run: |
          mkdir dist
          tar -czf "dist/$ASSET" -C build lispm-doom-engine dsda-doom.wad
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: engine-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: engine-release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # lispm-prebuilt, which downloads the engine.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-prebuilt
          path: .deps/lispm-prebuilt
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '31.1'
      - uses: actions/download-artifact@v8
        with:
          pattern: engine-*
          path: releases/engine-${{ needs.version.outputs.version }}
          merge-multiple: true
      - name: Checksums
        working-directory: releases/engine-${{ needs.version.outputs.version }}
        run: |
          sha256sum lispm-doom-engine-* > SHA256SUMS
          cat SHA256SUMS
      - name: Pin it as a release does
        run: >-
          emacs -Q --batch -L lisp -L .deps/lispm-prebuilt -l lispm-doom-engine
          --eval "(setq lispm-doom-engine-prebuilt-url \"file://$PWD/releases\")"
          -f lispm-doom-engine-batch-pin
      - name: Publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=engine-$VERSION
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is published already"
            exit 0
          fi
          commit=$(git rev-parse HEAD)
          gh release create "$tag" releases/"$tag"/* \
            --target "$commit" --latest=false \
            --title "Engine $VERSION" \
            --notes "lispm-doom's engine, dsda-doom $(cut -d' ' -f1 engine/DSDA) with its window an Emacs buffer, from $commit, for macOS on Apple silicon and on Intel, by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.

          It links with Homebrew's sdl2_mixer, libsndfile and libzip.  lispm-doom downloads the one for its computer, and keeps it only when its SHA-256 is the one its Lisp pins in lisp/lispm-doom-engine-sums.eld, which \`make pin\` writes from this release."
