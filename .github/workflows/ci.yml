name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  emacs:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 30 and 31 must refuse, fetching and running nothing.
        emacs: ['30.1', '31.1', snapshot]
    steps:
      - uses: actions/checkout@v7
      # lispm-prebuilt, which downloads the engine.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-prebuilt
          path: .deps/lispm-prebuilt
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Byte-compile
        run: make compile LISPM_PREBUILT=.deps/lispm-prebuilt
      - name: Test
        run: make test LISPM_PREBUILT=.deps/lispm-prebuilt
